# ============================================================================
# 云端打包「未签名 IPA」—— CloudDrive WebView 壳 App
#
# 流程：xcodegen 现场生成 .xcodeproj → xcodebuild archive（关闭签名）
#       → Payload + zip 打未签名 IPA → 上传 Artifact + 发布 Release
#
# 产物是【未签名】IPA，需用免费 Apple ID（Sideloadly / AltStore / SideStore）
# 或自备证书重签后才能装到 iPhone 上。
# ============================================================================

name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

env:
  # 不要用 macos-latest（移动标签，GitHub 换系统时会毫无征兆地构建失败）
  #   macos-15 → 默认 Xcode 16.4，跑 iOS 15 最低版本的项目更稳
  XCODE_PATH: /Applications/Xcode_16.4.app
  PRODUCT_NAME: CloudDrive

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境探测
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          xcodegen generate
          ls -d *.xcodeproj

      - name: 探测容器与 scheme
        id: probe
        run: |
          set -euo pipefail
          WS="$(find . -maxdepth 2 -name '*.xcworkspace' -not -path '*/.*' | head -1 || true)"
          PRJ="$(find . -maxdepth 2 -name '*.xcodeproj' -not -path '*/.*' | head -1 || true)"
          if [ -n "$WS" ]; then
            echo "flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "container=$WS"  >> "$GITHUB_OUTPUT"
          elif [ -n "$PRJ" ]; then
            echo "flag=-project"   >> "$GITHUB_OUTPUT"
            echo "container=$PRJ"  >> "$GITHUB_OUTPUT"
          else
            echo "::error::找不到 .xcworkspace 或 .xcodeproj"
            exit 1
          fi
          echo "检测到容器: ${WS:-$PRJ}"

          JSON="$(xcodebuild ${WS:+-workspace "$WS"} ${PRJ:+-project "$PRJ"} -list -json)"
          echo "$JSON"
          SCHEME_FOUND="$(printf '%s' "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); n=d.get('workspace') or d.get('project') or {}; s=n.get('schemes') or []; print(s[0] if s else '')")"
          if [ -z "$SCHEME_FOUND" ]; then
            echo "::error::没有探测到 scheme"
            exit 1
          fi
          echo "scheme=$SCHEME_FOUND" >> "$GITHUB_OUTPUT"
          echo "自动探测到 scheme: $SCHEME_FOUND"

      - name: Archive（关闭代码签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            ${{ steps.probe.outputs.flag }} "${{ steps.probe.outputs.container }}" \
            -scheme "${{ steps.probe.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -300

      - name: 打包成未签名 IPA
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/build/App.xcarchive"
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::archive 里没有找到 .app"
            exit 1
          fi
          echo "App: $APP"
          mkdir -p "$RUNNER_TEMP/out/Payload"
          # ditto 保留符号链接与扩展属性；符号链接丢了装到手机上会报 "app is damaged"
          ditto "$APP" "$RUNNER_TEMP/out/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/out"
          # -y 必须带：.app 内 framework 大量用 symlink
          zip -qry "${PRODUCT_NAME}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "${PRODUCT_NAME}-unsigned.ipa"

      - name: 校验产物确实是未签名的
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/out/${PRODUCT_NAME}-unsigned.ipa"
          unzip -l "$IPA" | head -30
          if unzip -l "$IPA" | grep -q '_CodeSignature/'; then
            echo "::error::产物里出现 _CodeSignature/，签名没有被完全关闭"
            exit 1
          fi
          if unzip -l "$IPA" | grep -q 'embedded.mobileprovision'; then
            echo "::error::产物里出现 embedded.mobileprovision，这不是未签名包"
            exit 1
          fi
          echo "✅ 已确认是未签名 IPA"

      - name: 上传 Artifact（需登录 GitHub 才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（免登录下载链接）
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/out/${PRODUCT_NAME}-unsigned.ipa"
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$IPA" \
            --title "${PRODUCT_NAME} 未签名 IPA ${TAG}" \
            --notes "由 GitHub Actions 在 macOS runner 上构建的**未签名** IPA。需要用免费 Apple ID（Sideloadly / AltStore / SideStore）或自备证书重签后才能安装。" \
            --latest
          echo "下载页: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
